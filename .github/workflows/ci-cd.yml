name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      # 4️⃣ Lint code (non-blocking)
      - name: Lint with flake8
        run: flake8 src tests || true

      # 5️⃣ Run unit tests (FIXED: PYTHONPATH)
      #- name: Run unit tests
       # run: |
        #  export PYTHONPATH=$PYTHONPATH:$(pwd)
         # pytest tests/ --maxfail=1 --disable-warnings -q

      # 6️⃣ Train the model
      - name: Train model
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python src/train.py

      # 7️⃣ Evaluate the model (optional but recommended)
      - name: Evaluate model
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python src/evaluate.py

      # 8️⃣ Upload trained model artifacts
      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/
